<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filter for clean rendering -->
    <style>
      .bg { fill: #FFFFFF; }
      .brand-blue { fill: #2563EB; stroke: #2563EB; }
      .brand-green { fill: #10B981; stroke: #10B981; }
      .text-dark { fill: #1E293B; }
      .text-green { fill: #10B981; }
      .text-sub { fill: #64748B; letter-spacing: 0.55em; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%" />

  <!-- ICON GROUP -->
  <g transform="translate(110, 70)">
    <!-- Blue 'Z' Shape -->
    <path class="brand-blue" 
          d="M 35 30 
             L 245 30 
             A 18 18 0 0 1 259 58 
             L 75 200 
             L 245 200 
             A 18 18 0 0 1 245 236 
             L 35 236 
             A 18 18 0 0 1 21 208 
             L 205 66 
             L 35 66 
             A 18 18 0 0 1 35 30 Z" 
          stroke-width="2" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Green Bridge Arc Overlay -->
    <path d="M 20 220 
             C 70 145, 125 120, 180 145 
             C 210 158, 235 185, 260 215" 
          fill="none" 
          stroke="#10B981" 
          stroke-width="32" 
          stroke-linecap="round"/>
  </g>

  <!-- TEXT GROUP -->
  <g transform="translate(250, 360)" text-anchor="middle">
    <!-- Main Title: ZubiaSocial -->
    <text y="0" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="52" font-weight="800">
      <tspan class="text-dark">Zubia</tspan>
      <tspan class="text-green" font-weight="600">Social</tspan>
    </text>

    <!-- Subtitle: EUSKADI -->
    <text x="6" y="48" class="text-sub" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-size="20" font-weight="700">
      EUSKADI
    </text>
  </g>
</svg>
